    class SupabaseDataManager {
      constructor() {
        this._initStorage();
      }

      _initStorage() {
        if (!localStorage.getItem(STORAGE_KEY)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
        }
      }

      getLocal() {
        try {
          const val = localStorage.getItem(STORAGE_KEY);
          return val ? JSON.parse(val) : SEED_DATA;
        } catch {
          return SEED_DATA;
        }
      }

      setLocal(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      async submit(form) {
        const randomDigits = Math.floor(1000 + Math.random() * 9000);
        const regId = `AURA26-${randomDigits}`;
        const timestamp = new Date().toISOString();

        const record = {
          id: 'reg-' + Date.now(),
          registration_id: regId,
          full_name: form.fullName.trim(),
          college: form.college.trim(),
          department: form.department.trim(),
          year: form.year,
          phone: form.phone.trim(),
          email: form.email.trim(),
          selected_events: form.selectedEvents,
          registration_fee: 120,
          payment_transaction_id: form.transactionId.trim(),
          payment_screenshot: form.screenshotDataUrl || null,
          payment_status: 'Pending',
          admin_notes: '',
          registration_date: timestamp,
          created_at: timestamp
        };

        const current = this.getLocal();
        current.unshift(record);
        this.setLocal(current);

        return { success: true, registration: record };
      }

      async updateStatus(id, newStatus) {
        const list = this.getLocal();
        const updated = list.map(item => {
          if (item.id === id || item.registration_id === id) {
            return { ...item, payment_status: newStatus };
          }
          return item;
        });
        this.setLocal(updated);
        return { success: true };
      }

      async delete(id) {
        const list = this.getLocal();
        const filtered = list.filter(item => item.id !== id && item.registration_id !== id);
        this.setLocal(filtered);
        return { success: true };
      }

      exportCSV(list) {
        const headers = ['Registration ID', 'Date', 'Full Name', 'College', 'Department', 'Year', 'Phone', 'Email', 'Selected Events', 'Fee', 'Transaction ID', 'Status'];
        const rows = list.map(r => [
          `"${r.registration_id}"`,
          `"${new Date(r.registration_date).toLocaleString()}"`,
          `"${(r.full_name || '').replace(/"/g, '""')}"`,
          `"${(r.college || '').replace(/"/g, '""')}"`,
          `"${(r.department || '').replace(/"/g, '""')}"`,
          `"${r.year || ''}"`,
          `"${r.phone || ''}"`,
          `"${r.email || ''}"`,
          `"${(r.selected_events || []).join(', ')}"`,
          `"${r.registration_fee || 120}"`,
          `"${r.payment_transaction_id || ''}"`,
          `"${r.payment_status || 'Pending'}"`
        ]);

        const csvContent = [headers.join(','), ...rows.map(row => row.join(','))].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `AURA_2026_Registrations_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      reset() {
        this.setLocal(SEED_DATA);
        return SEED_DATA;
      }
    }

    }

    // --- 9. REGISTRATION FORM COMPONENT ---
    function RegistrationForm({ preselectedEvent, onSuccessRegistration }) {
      const [formData, setFormData] = useState({
        fullName: '',
        college: '',
        department: '',
        year: '3rd Year',
        phone: '',
        email: '',
        selectedEvents: [],
        transactionId: '',
        screenshotDataUrl: '',
        confirmed: false
      });

      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [copiedUpi, setCopiedUpi] = useState(false);
      const [screenshotPreview, setScreenshotPreview] = useState(null);
      const [qrCodeUrl, setQrCodeUrl] = useState('');

      useEffect(() => {
        if (preselectedEvent) {
          setFormData(prev => {
            if (!prev.selectedEvents.includes(preselectedEvent)) {
              return { ...prev, selectedEvents: [...prev.selectedEvents, preselectedEvent] };
            }
            return prev;
          });
        }
      }, [preselectedEvent]);

      useEffect(() => {
        const upiLink = `upi://pay?pa=${SYMPOSIUM_CONFIG.upiId}&pn=AURA2026_Symposium&am=${SYMPOSIUM_CONFIG.registrationFee}&cu=INR&tn=AURA2026_Registration`;
        const qr = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=10&color=000000&bgcolor=ffffff&data=${encodeURIComponent(upiLink)}`;
        setQrCodeUrl(qr);
      }, []);

      const toggleEvent = (name) => {
        setFormData(prev => {
          const exists = prev.selectedEvents.includes(name);
          const updated = exists ? prev.selectedEvents.filter(e => e !== name) : [...prev.selectedEvents, name];
          return { ...prev, selectedEvents: updated };
        });
        if (errors.selectedEvents) setErrors(prev => ({ ...prev, selectedEvents: '' }));
      };

      const handleCopyUpi = () => {
        navigator.clipboard.writeText(SYMPOSIUM_CONFIG.upiId);
        setCopiedUpi(true);
        setTimeout(() => setCopiedUpi(false), 2500);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          setErrors(prev => ({ ...prev, screenshot: 'Please upload an image file (PNG, JPG, or WEBP).' }));
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          setErrors(prev => ({ ...prev, screenshot: 'Screenshot size must be under 5MB.' }));
          return;
        }

        setErrors(prev => ({ ...prev, screenshot: '' }));
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const result = uploadEvent.target.result;
          setScreenshotPreview(result);
          setFormData(prev => ({ ...prev, screenshotDataUrl: result }));
        };
        reader.readAsDataURL(file);
      };

      const validate = () => {
        const errs = {};
        if (!formData.fullName.trim()) errs.fullName = 'Full Name is required.';
        if (!formData.college.trim()) errs.college = 'College Name is required.';
        if (!formData.department.trim()) errs.department = 'Department is required.';

        if (!formData.phone.trim()) {
          errs.phone = 'Phone Number is required.';
        } else if (!/^[6-9]\d{9}$/.test(formData.phone.trim())) {
          errs.phone = 'Enter a valid 10-digit Indian mobile number.';
        }

        if (!formData.email.trim()) {
          errs.email = 'Email Address is required.';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email.trim())) {
          errs.email = 'Enter a valid email address.';
        }

        if (formData.selectedEvents.length === 0) {
          errs.selectedEvents = 'Please select at least one event to participate.';
        }

        if (!formData.transactionId.trim()) {
          errs.transactionId = 'UPI Transaction ID / UTR Number is required.';
        } else if (formData.transactionId.trim().length < 6) {
          errs.transactionId = 'Enter a valid Transaction ID / UTR Number (min 6 digits).';
        }

        if (!formData.confirmed) {
          errs.confirmed = 'You must confirm that the information provided is correct.';
        }

        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!validate()) return;

        setIsSubmitting(true);
        try {
          const response = await dataManager.submit(formData);
          if (response && response.success) {
            onSuccessRegistration(response.registration);
          } else {
            alert('Could not submit registration. Please try again.');
          }
        } catch (err) {
          console.error(err);
          alert('Submission error occurred.');
        } finally {
          setIsSubmitting(false);
        }
      };

      const techEvents = EVENTS.filter(e => e.type === 'technical');
      const nonTechEvents = EVENTS.filter(e => e.type === 'non-technical');

      return (
        <section id="register" className="py-24 px-4 relative overflow-hidden">
          <div className="glow-orb-cyan w-96 h-96 top-20 -left-20 z-0 opacity-40" />
          <div className="glow-orb-purple w-96 h-96 bottom-20 -right-20 z-0 opacity-40" />

          <div className="max-w-4xl mx-auto relative z-10">
            <div className="text-center max-w-2xl mx-auto mb-12">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-semibold uppercase tracking-wider mb-3">
                <span>Online Registration</span>
              </div>
              <h2 className="font-heading font-black text-3xl sm:text-4xl md:text-5xl text-white mb-4">
                Register for <span className="text-gradient-cyan">AURA 2026</span>
              </h2>
              <p className="text-gray-300 text-sm sm:text-base leading-relaxed">
                Fill in your personal details, select your events, complete the ₹120 UPI fee payment, and submit your registration.
              </p>
            </div>

            <form onSubmit={handleSubmit} className="glass-panel p-6 sm:p-10 rounded-3xl border border-white/10 shadow-2xl relative space-y-10">
              
              {/* Step 1: Personal Details */}
              <div>
                <div className="flex items-center gap-3 pb-4 mb-6 border-b border-white/10">
                  <div className="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center font-heading font-black text-sm text-cyan-400">1</div>
                  <div>
                    <h3 className="font-heading font-bold text-lg sm:text-xl text-white">Personal & Academic Details</h3>
                    <p className="text-xs text-gray-400">Enter your official details for certificate generation</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Full Name <span className="text-red-400">*</span></label>
                    <input
                      type="text"
                      placeholder="e.g. Vigneshwaran K"
                      value={formData.fullName}
                      onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-cyan-400 focus:bg-white/[0.07] transition-all"
                    />
                    {errors.fullName && <p className="text-xs text-red-400 mt-1">{errors.fullName}</p>}
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">College Name <span className="text-red-400">*</span></label>
                    <input
                      type="text"
                      placeholder="e.g. Adhiparasakthi Engineering College"
                      value={formData.college}
                      onChange={(e) => setFormData({ ...formData, college: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-cyan-400 focus:bg-white/[0.07] transition-all"
                    />
                    {errors.college && <p className="text-xs text-red-400 mt-1">{errors.college}</p>}
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Department <span className="text-red-400">*</span></label>
                    <input
                      type="text"
                      placeholder="e.g. Information Technology"
                      value={formData.department}
                      onChange={(e) => setFormData({ ...formData, department: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-cyan-400 focus:bg-white/[0.07] transition-all"
                    />
                    {errors.department && <p className="text-xs text-red-400 mt-1">{errors.department}</p>}
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Year of Study <span className="text-red-400">*</span></label>
                    <select
                      value={formData.year}
                      onChange={(e) => setFormData({ ...formData, year: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl bg-[#0b0f24] border border-white/10 text-white text-sm focus:outline-none focus:border-cyan-400 transition-all cursor-pointer"
                    >
                      <option value="1st Year">1st Year</option>
                      <option value="2nd Year">2nd Year</option>
                      <option value="3rd Year">3rd Year</option>
                      <option value="4th Year">4th Year</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">WhatsApp / Phone Number <span className="text-red-400">*</span></label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-semibold">+91</span>
                      <input
                        type="tel"
                        maxLength={10}
                        placeholder="9876543210"
                        value={formData.phone}
                        onChange={(e) => setFormData({ ...formData, phone: e.target.value.replace(/\D/g, '') })}
                        className="w-full pl-14 pr-4 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-cyan-400 focus:bg-white/[0.07] transition-all"
                      />
                    </div>
                    {errors.phone && <p className="text-xs text-red-400 mt-1">{errors.phone}</p>}
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Email Address <span className="text-red-400">*</span></label>
                    <input
                      type="email"
                      placeholder="vignesh@example.com"
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-cyan-400 focus:bg-white/[0.07] transition-all"
                    />
                    {errors.email && <p className="text-xs text-red-400 mt-1">{errors.email}</p>}
                  </div>
                </div>
              </div>

              {/* Step 2: Events Selection */}
              <div>
                <div className="flex items-center justify-between pb-4 mb-6 border-b border-white/10">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center font-heading font-black text-sm text-cyan-400">2</div>
                    <div>
                      <h3 className="font-heading font-bold text-lg sm:text-xl text-white">Select Your Events</h3>
                      <p className="text-xs text-gray-400">Choose one or more events to compete in</p>
                    </div>
                  </div>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                    {formData.selectedEvents.length} Selected
                  </span>
                </div>

                {errors.selectedEvents && (
                  <div className="p-3 mb-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">
                    {errors.selectedEvents}
                  </div>
                )}

                {/* Tech */}
                <div className="mb-6">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-3 flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-cyan-400" />
                    <span>Technical Events</span>
                  </h4>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    {techEvents.map((ev) => {
                      const isChecked = formData.selectedEvents.includes(ev.name);
                      return (
                        <div
                          key={ev.id}
                          onClick={() => toggleEvent(ev.name)}
                          className={`p-4 rounded-xl border cursor-pointer transition-all flex flex-col justify-between ${
                            isChecked ? 'bg-cyan-950/60 border-cyan-400 shadow-md shadow-cyan-500/20' : 'bg-white/[0.02] border-white/10 hover:border-white/20'
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <span className="font-heading font-bold text-sm text-white">{ev.name}</span>
                            <div className={`w-5 h-5 rounded-md flex items-center justify-center border transition-all ${
                              isChecked ? 'bg-cyan-400 border-cyan-400 text-black' : 'border-gray-500'
                            }`}>
                              {isChecked && (
                                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                                </svg>
                              )}
                            </div>
                          </div>
                          <p className="text-[11px] text-gray-400 line-clamp-2">{ev.tagline}</p>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Non Tech */}
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-purple-400 mb-3 flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-purple-400" />
                    <span>Non-Technical Events</span>
                  </h4>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    {nonTechEvents.map((ev) => {
                      const isChecked = formData.selectedEvents.includes(ev.name);
                      return (
                        <div
                          key={ev.id}
                          onClick={() => toggleEvent(ev.name)}
                          className={`p-4 rounded-xl border cursor-pointer transition-all flex flex-col justify-between ${
                            isChecked ? 'bg-purple-950/60 border-purple-400 shadow-md shadow-purple-500/20' : 'bg-white/[0.02] border-white/10 hover:border-white/20'
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <span className="font-heading font-bold text-sm text-white">{ev.name}</span>
                            <div className={`w-5 h-5 rounded-md flex items-center justify-center border transition-all ${
                              isChecked ? 'bg-purple-400 border-purple-400 text-white' : 'border-gray-500'
                            }`}>
                              {isChecked && (
                                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                                </svg>
                              )}
                            </div>
                          </div>
                          <p className="text-[11px] text-gray-400 line-clamp-2">{ev.tagline}</p>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Step 3: Payment Section */}
              <div>
                <div className="flex items-center gap-3 pb-4 mb-6 border-b border-white/10">
                  <div className="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center font-heading font-black text-sm text-cyan-400">3</div>
                  <div>
                    <h3 className="font-heading font-bold text-lg sm:text-xl text-white">Payment Details</h3>
                    <p className="text-xs text-gray-400">Registration Fee: ₹{SYMPOSIUM_CONFIG.registrationFee} per participant</p>
                  </div>
                </div>

                <div className="p-6 rounded-2xl bg-gradient-to-br from-[#0c122e] to-[#121c45] border border-cyan-500/30 shadow-xl mb-6">
                  <div className="flex flex-col md:flex-row items-center gap-6">
                    <div className="bg-white p-3 rounded-2xl shadow-xl flex flex-col items-center justify-center shrink-0">
                      {qrCodeUrl ? (
                        <img src={qrCodeUrl} alt="UPI QR Code" className="w-40 h-40 object-contain rounded-lg" />
                      ) : (
                        <div className="w-40 h-40 bg-gray-200 animate-pulse rounded-lg flex items-center justify-center text-xs text-gray-500">Loading QR...</div>
                      )}
                      <span className="text-[10px] font-bold text-gray-800 mt-2 uppercase tracking-wide">Scan with any UPI App</span>
                    </div>

                    <div className="flex-1 text-center md:text-left space-y-3">
                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-400/10 border border-cyan-400/30 text-cyan-300 text-xs font-bold">
                        <span>Registration Fee: ₹{SYMPOSIUM_CONFIG.registrationFee}</span>
                      </div>

                      <h4 className="font-heading font-bold text-lg text-white">
                        UPI ID: {SYMPOSIUM_CONFIG.upiId}
                      </h4>

                      <div className="flex flex-col sm:flex-row items-center gap-2.5">
                        <div className="px-4 py-2.5 rounded-xl bg-black/40 border border-white/10 text-cyan-400 font-mono font-bold text-sm select-all w-full sm:w-auto text-center">
                          {SYMPOSIUM_CONFIG.upiId}
                        </div>

                        <button
                          type="button"
                          onClick={handleCopyUpi}
                          className="btn-cyber-secondary text-xs py-2 px-4 whitespace-nowrap"
                        >
                          {copiedUpi ? (
                            <>
                              <svg className="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                              </svg>
                              <span className="text-emerald-400 font-bold">Copied!</span>
                            </>
                          ) : (
                            <>
                              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                              </svg>
                              <span>Copy UPI ID</span>
                            </>
                          )}
                        </button>

    function Admin({ onClose }) {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passcode, setPasscode] = useState('');
      const [authError, setAuthError] = useState('');

      const [registrations, setRegistrations] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterEvent, setFilterEvent] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [selectedItem, setSelectedItem] = useState(null);

      const load = () => {
        setRegistrations(dataManager.getLocal());
      };

      useEffect(() => {
        if (isAuthenticated) load();
      }, [isAuthenticated]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (passcode.trim() === 'aura2026admin' || passcode.trim() === 'admin123') {
          setIsAuthenticated(true);
          setAuthError('');
        } else {
          setAuthError('Invalid Admin Passcode. Try aura2026admin');
        }
      };

      const handleStatus = async (id, status) => {
        await dataManager.updateStatus(id, status);
        load();
        if (selectedItem && (selectedItem.id === id || selectedItem.registration_id === id)) {
          setSelectedItem(prev => ({ ...prev, payment_status: status }));
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Are you sure you want to delete this record?')) return;
        await dataManager.delete(id);
        load();
        if (selectedItem && (selectedItem.id === id || selectedItem.registration_id === id)) {
          setSelectedItem(null);
        }
      };

      const handleReset = () => {
        if (confirm('Reset sample registrations?')) {
          dataManager.reset();
          load();
        }
      };

      const filtered = registrations.filter(r => {
        const q = searchQuery.toLowerCase().trim();
        const matchesQuery = !q ||
          (r.full_name && r.full_name.toLowerCase().includes(q)) ||
          (r.registration_id && r.registration_id.toLowerCase().includes(q)) ||
          (r.college && r.college.toLowerCase().includes(q)) ||
          (r.department && r.department.toLowerCase().includes(q)) ||
          (r.phone && r.phone.includes(q)) ||
          (r.email && r.email.toLowerCase().includes(q)) ||
          (r.payment_transaction_id && r.payment_transaction_id.toLowerCase().includes(q));

        const matchesStatus = filterStatus === 'all' || r.payment_status === filterStatus;
        const matchesEvent = filterEvent === 'all' || (Array.isArray(r.selected_events) && r.selected_events.includes(filterEvent));

        return matchesQuery && matchesStatus && matchesEvent;
      });

      // Stats
      const total = registrations.length;
      let verified = 0;
      let pending = 0;
      let techCount = 0;
      let nonTechCount = 0;
      registrations.forEach(r => {
        if (r.payment_status === 'Verified') verified++;
        else pending++;
        if (Array.isArray(r.selected_events)) {
          r.selected_events.forEach(ev => {
            if (['Prompt War', 'Debugging', 'Data Analyzer'].includes(ev)) techCount++;
            if (['Box Cricket', 'PUBG', 'Word Smash'].includes(ev)) nonTechCount++;
          });
        }
      });

      if (!isAuthenticated) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-lg">
            <div className="glass-panel max-w-md w-full p-8 rounded-3xl border border-cyan-500/30 shadow-2xl relative">
              <button onClick={onClose} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white rounded-full bg-white/5">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>

              <div className="text-center mb-6">
                <div className="w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center mx-auto mb-3 text-cyan-400">
                  <svg className="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <h3 className="font-heading font-black text-2xl text-white">Organizer Admin Portal</h3>
                <p className="text-xs text-gray-400 mt-1">AURA 2026 • Department of Information Technology</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Admin Passcode</label>
                  <input
                    type="password"
                    placeholder="Enter admin passcode"
                    value={passcode}
                    onChange={e => setPasscode(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-cyan-400 font-mono"
                    autoFocus
                  />
                  {authError && <p className="text-xs text-red-400 mt-1.5">{authError}</p>}
                  <p className="text-[11px] text-gray-400 mt-2">
                    Default Passcode: <code className="text-cyan-400 font-mono bg-white/5 px-1 py-0.5 rounded">aura2026admin</code>
                  </p>
                </div>

                <button type="submit" className="btn-cyber-primary w-full py-3.5 text-sm font-bold uppercase tracking-wider">
                  Authenticate & Access
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="fixed inset-0 z-50 bg-[#060813] text-white flex flex-col overflow-hidden">
          <header className="bg-[#090d24] border-b border-white/10 px-4 sm:px-8 py-4 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-3">
              <img src="assets/aura-logo.jpg" alt="AURA 2026" className="w-9 h-9 rounded-lg object-cover border border-cyan-400" />
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="font-heading font-black text-lg text-white">AURA 2026 Admin Dashboard</h2>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">Live</span>
                </div>
                <p className="text-[11px] text-gray-400">Department of Information Technology, Adhiparasakthi Engineering College</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => dataManager.exportCSV(filtered)}
                className="btn-cyber-primary text-xs px-4 py-2 font-bold flex items-center gap-1.5"
                title="Download CSV for Excel or Google Sheets"
              >
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>Export CSV</span>
              </button>

              <button onClick={onClose} className="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10 text-xs flex items-center gap-1">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span>Exit Dashboard</span>
              </button>
            </div>
          </header>

          <div className="flex-1 overflow-y-auto p-4 sm:p-8 space-y-6">
            
            {/* Stat Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
              <div className="glass-panel p-4 rounded-2xl border border-white/10">
                <span className="text-[11px] uppercase font-bold text-gray-400 block mb-1">Total Registrations</span>
                <div className="font-heading font-black text-2xl text-white">{total}</div>
                <span className="text-[10px] text-cyan-400">Total participants</span>
              </div>
              <div className="glass-panel p-4 rounded-2xl border border-white/10">
                <span className="text-[11px] uppercase font-bold text-gray-400 block mb-1">Verified Payments</span>
                <div className="font-heading font-black text-2xl text-emerald-400">{verified}</div>
                <span className="text-[10px] text-emerald-400 font-medium">Approved</span>
              </div>
              <div className="glass-panel p-4 rounded-2xl border border-white/10">
                <span className="text-[11px] uppercase font-bold text-gray-400 block mb-1">Pending Payments</span>
                <div className="font-heading font-black text-2xl text-amber-400">{pending}</div>
                <span className="text-[10px] text-amber-400 font-medium">Needs verification</span>
              </div>
              <div className="glass-panel p-4 rounded-2xl border border-white/10">
                <span className="text-[11px] uppercase font-bold text-gray-400 block mb-1">Technical Events</span>
                <div className="font-heading font-black text-2xl text-cyan-400">{techCount}</div>
                <span className="text-[10px] text-gray-400">Total entries</span>
              </div>
              <div className="glass-panel p-4 rounded-2xl border border-white/10">
                <span className="text-[11px] uppercase font-bold text-gray-400 block mb-1">Non-Tech Events</span>
                <div className="font-heading font-black text-2xl text-purple-400">{nonTechCount}</div>
                <span className="text-[10px] text-gray-400">Total entries</span>
              </div>
              <div className="glass-panel p-4 rounded-2xl border border-white/10 bg-gradient-to-br from-cyan-950/40 to-indigo-950/40">
                <span className="text-[11px] uppercase font-bold text-cyan-300 block mb-1">Verified Revenue</span>
                <div className="font-heading font-black text-2xl text-white">₹{(verified * 120).toLocaleString()}</div>
                <span className="text-[10px] text-gray-400">Total ₹{(total * 120).toLocaleString()}</span>
              </div>
            </div>

            {/* Filter Bar */}
            <div className="glass-panel p-4 sm:p-5 rounded-2xl border border-white/10 flex flex-col md:flex-row items-center gap-4 justify-between">
              <div className="relative w-full md:w-96">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </span>
                <input
                  type="text"
                  placeholder="Search by name, college, phone, reg ID, UTR..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white/[0.04] border border-white/10 text-white placeholder-gray-500 text-xs sm:text-sm focus:outline-none focus:border-cyan-400"
                />
              </div>

              <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select
                  value={filterEvent}
                  onChange={e => setFilterEvent(e.target.value)}
                  className="px-3 py-2 rounded-xl bg-[#0b0f24] border border-white/10 text-xs text-gray-300 focus:outline-none focus:border-cyan-400"
                >
                  <option value="all">All Events</option>
                  {EVENTS.map(ev => <option key={ev.id} value={ev.name}>{ev.name} ({ev.category})</option>)}
                </select>

                <select
                  value={filterStatus}
                  onChange={e => setFilterStatus(e.target.value)}
                  className="px-3 py-2 rounded-xl bg-[#0b0f24] border border-white/10 text-xs text-gray-300 focus:outline-none focus:border-cyan-400"
                >
                  <option value="all">All Payment Statuses</option>
                  <option value="Pending">Pending Verification</option>
                  <option value="Verified">Verified / Approved</option>
                  <option value="Rejected">Rejected</option>
                </select>

                <button onClick={handleReset} className="px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white border border-white/10 text-xs">
                  Reset Demo Records
                </button>
              </div>
            </div>

            {/* Table */}
            <div className="glass-panel rounded-2xl border border-white/10 overflow-hidden shadow-xl">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-[#0a0e27] border-b border-white/10 text-gray-400 uppercase font-semibold tracking-wider">
                      <th className="py-3.5 px-4">Reg ID</th>
                      <th className="py-3.5 px-4">Participant Details</th>
                      <th className="py-3.5 px-4">College & Dept</th>
                      <th className="py-3.5 px-4">Events</th>
                      <th className="py-3.5 px-4">Payment UTR</th>
                      <th className="py-3.5 px-4">Status</th>
                      <th className="py-3.5 px-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-white/5">
                    {filtered.length === 0 ? (
                      <tr>
                        <td colSpan={7} className="py-12 text-center text-gray-500">
                          No registrations matched your current search and filter criteria.
                        </td>
                      </tr>
                    ) : (
                      filtered.map(item => (
                        <tr key={item.id || item.registration_id} className="hover:bg-white/[0.02]">
                          <td className="py-3.5 px-4 font-mono font-bold text-cyan-400">
                            {item.registration_id}
                            <span className="block text-[10px] text-gray-500 font-sans font-normal">
                              {new Date(item.registration_date).toLocaleDateString()}
                            </span>
                          </td>
                          <td className="py-3.5 px-4">
                            <span className="font-bold text-white text-sm block">{item.full_name}</span>
                            <div className="text-gray-400 text-[11px] flex items-center gap-2 mt-0.5">
                              <span>{item.phone}</span>
                              <span>•</span>
                              <span className="truncate max-w-[150px]">{item.email}</span>
                            </div>
                          </td>
                          <td className="py-3.5 px-4">
                            <span className="text-gray-300 font-medium block truncate max-w-[200px]">{item.college}</span>
                            <span className="text-gray-500 text-[11px]">{item.department} ({item.year})</span>
                          </td>
                          <td className="py-3.5 px-4">
                            <div className="flex flex-wrap gap-1 max-w-xs">
                              {Array.isArray(item.selected_events) && item.selected_events.map((ev, i) => (
                                <span key={i} className="px-2 py-0.5 rounded-full bg-white/5 text-gray-300 text-[10px] font-medium border border-white/5">
                                  {ev}
                                </span>
                              ))}
                            </div>
                          </td>
                          <td className="py-3.5 px-4 font-mono text-[11px]">
                            <span className="text-gray-300 font-semibold block">{item.payment_transaction_id}</span>
                            <span className="text-[10px] text-cyan-400">₹{item.registration_fee || 120}</span>
                          </td>
                          <td className="py-3.5 px-4">
                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${
                              item.payment_status === 'Verified'
                                ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'
                                : item.payment_status === 'Rejected'
                                ? 'bg-red-500/10 text-red-400 border border-red-500/30'
                                : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'
                            }`}>
                              <span className={`w-1.5 h-1.5 rounded-full ${
                                item.payment_status === 'Verified' ? 'bg-emerald-400' : item.payment_status === 'Rejected' ? 'bg-red-400' : 'bg-amber-400'
                              }`} />
                              {item.payment_status || 'Pending'}
                            </span>
                          </td>
                          <td className="py-3.5 px-4 text-right">
                            <div className="inline-flex items-center gap-1.5">
                              <button
                                onClick={() => setSelectedItem(item)}
                                className="p-1.5 rounded-lg bg-white/5 hover:bg-cyan-500/20 text-gray-300 hover:text-cyan-300 border border-white/10"
                                title="View Details & Screenshot"
                              >
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                              </button>
                              <button
                                onClick={() => handleStatus(item.id, 'Verified')}
                                className="p-1.5 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"
                                title="Approve"
                              >
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" />
                                </svg>
                              </button>
                              <button
                                onClick={() => handleStatus(item.id, 'Rejected')}
                                className="p-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30"
                                title="Reject"
                              >
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                              </button>
                              <button
                                onClick={() => handleDelete(item.id)}
                                className="p-1.5 rounded-lg bg-white/5 hover:bg-red-500/20 text-gray-400 hover:text-red-400 border border-white/10"
                                title="Delete"
                              >
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

          </div>

          {/* Details & Screenshot Modal */}
          {selectedItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-panel max-w-2xl w-full rounded-3xl border border-cyan-500/30 p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => setSelectedItem(null)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white rounded-full bg-white/5">
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>

                <div className="border-b border-white/10 pb-4 mb-6">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-cyan-400">Registration Details</span>
                  <h3 className="font-heading font-black text-2xl text-white">{selectedItem.full_name}</h3>
                  <p className="text-xs text-gray-400 font-mono mt-0.5">ID: {selectedItem.registration_id}</p>
                </div>

                <div className="grid grid-cols-2 gap-4 text-xs mb-6">
                  <div className="p-3 rounded-xl bg-white/[0.02] border border-white/5">
                    <span className="text-gray-400 block mb-1">College</span>
                    <span className="font-bold text-white">{selectedItem.college}</span>
                  </div>
                  <div className="p-3 rounded-xl bg-white/[0.02] border border-white/5">
                    <span className="text-gray-400 block mb-1">Department & Year</span>
                    <span className="font-bold text-white">{selectedItem.department} ({selectedItem.year})</span>
                  </div>
                  <div className="p-3 rounded-xl bg-white/[0.02] border border-white/5">
                    <span className="text-gray-400 block mb-1">Phone Number</span>
                    <span className="font-bold text-cyan-400 font-mono">{selectedItem.phone}</span>
                  </div>
                  <div className="p-3 rounded-xl bg-white/[0.02] border border-white/5">
                    <span className="text-gray-400 block mb-1">Email Address</span>
                    <span className="font-bold text-white">{selectedItem.email}</span>
                  </div>
                </div>

                <div className="mb-6 p-4 rounded-xl bg-white/[0.02] border border-white/5">
                  <span className="text-xs font-bold text-gray-300 block mb-2">Registered Events:</span>
                  <div className="flex flex-wrap gap-2">
                    {selectedItem.selected_events?.map((ev, i) => (
                      <span key={i} className="px-3 py-1 rounded-full bg-cyan-950/60 text-cyan-300 border border-cyan-500/30 text-xs font-semibold">
                        ✓ {ev}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="mb-6 p-4 rounded-xl bg-white/[0.03] border border-white/10 space-y-3">
                  <div className="flex items-center justify-between text-xs">
                    <div>
                      <span className="text-gray-400 block">UPI Transaction / UTR Number</span>
                      <span className="font-mono font-bold text-base text-cyan-400 select-all">{selectedItem.payment_transaction_id}</span>
                    </div>
                    <div className="text-right">
                      <span className="text-gray-400 block">Registration Fee</span>
                      <span className="font-bold text-white text-base">₹120.00</span>
                    </div>
                  </div>

                  {selectedItem.payment_screenshot ? (
                    <div>
                      <span className="text-xs text-gray-400 font-semibold block mb-2">Payment Screenshot:</span>
                      <div className="rounded-xl overflow-hidden border border-white/15 bg-black/60 max-h-64 flex items-center justify-center">
                        <img
                          src={selectedItem.payment_screenshot}
                          alt="Screenshot"
                          className="max-h-64 w-auto object-contain cursor-zoom-in"
                          onClick={() => window.open(selectedItem.payment_screenshot, '_blank')}
                        />
                      </div>
                      <span className="text-[10px] text-gray-500 mt-1 block">Click to view in new tab</span>
                    </div>
                  ) : (
                    <div className="p-3 rounded-lg bg-white/5 text-gray-400 text-xs text-center">No payment screenshot attached.</div>
                  )}
                </div>

                <div className="pt-4 border-t border-white/10 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-gray-400 font-medium">Update Status:</span>
                    <button
                      onClick={() => handleStatus(selectedItem.id, 'Verified')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                        selectedItem.payment_status === 'Verified' ? 'bg-emerald-500 text-black' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'
                      }`}
                    >
                      ✓ Approve
                    </button>
                    <button
                      onClick={() => handleStatus(selectedItem.id, 'Pending')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                        selectedItem.payment_status === 'Pending' ? 'bg-amber-500 text-black' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'
                      }`}
                    >
                      ⏳ Pending
                    </button>
                    <button
                      onClick={() => handleStatus(selectedItem.id, 'Rejected')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                        selectedItem.payment_status === 'Rejected' ? 'bg-red-500 text-white' : 'bg-red-500/10 text-red-400 border border-red-500/30'
                      }`}
                    >
                      ✕ Reject
                    </button>
                  </div>

                  <button onClick={() => setSelectedItem(null)} className="btn-cyber-secondary text-xs py-2 px-5">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 14. ROOT APP COORDINATOR ---
    function App() {
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [preselectedEvent, setPreselectedEvent] = useState(null);
      const [successfulRegistration, setSuccessfulRegistration] = useState(null);

      const scrollToRegister = (eventName = null) => {
        if (eventName) setPreselectedEvent(eventName);
        const el = document.getElementById('register');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const scrollToEvents = () => {
        const el = document.getElementById('events');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="relative min-h-screen text-white selection:bg-cyan-500 selection:text-black">
          {/* Global Fixed Background Video for Entire Website */}
          <div className="cyber-video-container">
            <video
              autoPlay
              loop
              muted
              playsInline
              webkit-playsinline="true"
              preload="auto"
              className="cyber-video-bg opacity-65"
            >
              <source src="assets/bg-video.mp4" type="video/mp4" />
            </video>
            {/* Global Dark Contrast Scrim for Text Legibility Across All Sections */}
            <div className="absolute inset-0 bg-[#060813]/60 pointer-events-none" />
          </div>

          {/* Main Content Layered Above Video */}
          <div className="relative z-10">
            <Navbar onOpenAdmin={() => setIsAdminOpen(true)} onRegisterClick={() => scrollToRegister()} />
            <Hero onExploreEvents={scrollToEvents} onRegisterNow={() => scrollToRegister()} />
            <About />
            <Events onRegisterEvent={(name) => scrollToRegister(name)} />
            <Schedule />
            <RegistrationForm preselectedEvent={preselectedEvent} onSuccessRegistration={(reg) => setSuccessfulRegistration(reg)} />
            <Contact />
            <Footer onOpenAdmin={() => setIsAdminOpen(true)} />
          </div>

          {successfulRegistration && (
            <SuccessModal registration={successfulRegistration} onClose={() => setSuccessfulRegistration(null)} />
          )}

          {isAdminOpen && (
            <Admin onClose={() => setIsAdminOpen(false)} />
          )}
        </div>
      );
    }

    // Render into root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
